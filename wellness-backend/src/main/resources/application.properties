spring.datasource.url=jdbc:mysql://localhost:3306/wellness_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=YOUR_DB_USERNAME
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=8080

jwt.secret=YOUR_JWT_SECRET
jwt.expiration=31536000000

google.calendar.client-id=YOUR_GOOGLE_CLIENT_ID
google.calendar.client-secret=YOUR_GOOGLE_CLIENT_SECRET
google.calendar.redirect-uri=http://localhost:8080/oauth2/callback/google

spring.sql.init.mode=always
google.maps.api.key=YOUR_GOOGLE_MAPS_KEY
